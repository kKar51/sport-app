<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://api.github.com; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#19212c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Журнал">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Журнал зала</title>
<link rel="stylesheet" href="app.css?v=12">
<link rel="stylesheet" href="progress.css?v=12">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="top-row">
      <div class="grow">
        <h1 class="cycle-title" id="cycle-title">Журнал зала</h1>
        <p class="cycle-sub" id="cycle-sub"></p>
      </div>
      <div class="top-side">
        <span class="status" id="status" role="status" aria-live="polite"></span>
        <button class="gear" id="gear" type="button" aria-label="Настройки">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 2.8l1.6 2.3 2.7-.7.7 2.7 2.6 1-.9 2.6 1.6 2.3-2.3 1.6.3 2.8-2.8.3-1 2.6-2.6-1L12 21.2l-1.6-2.3-2.6 1-1-2.6-2.8-.3.3-2.8-2.3-1.6 1.6-2.3-.9-2.6 2.6-1 .7-2.7 2.7.7z"/></svg>
        </button>
      </div>
    </div>
    <div class="strip" id="strip" aria-hidden="true"></div>
  </div>
</header>

<main class="wrap" id="view"><div class="empty"><b>Загружаю журнал</b>Секунду.</div></main>

<nav class="tabs" aria-label="Разделы">
  <div class="tabs-in" id="tabs" role="tablist">
    <button type="button" role="tab" data-tab="overview" aria-selected="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg><span>Сегодня</span></button>
    <button type="button" role="tab" data-tab="today" aria-selected="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 8v8m10-8v8M4 10v4m16-4v4M7 12h10"/></svg><span>Тренировка</span></button>
    <button type="button" role="tab" data-tab="food" aria-selected="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v6a3 3 0 0 0 6 0V3M8 3v18M18 3v18m0-18c-3 3-3 7 0 8"/></svg><span>Еда</span></button>
    <button type="button" role="tab" data-tab="stats" aria-selected="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V12m5 8V6m5 14v-9m5 9V4"/></svg><span>Прогресс</span></button>
  </div>
</nav>
<noscript><p class="wrap">Для журнала нужен включённый JavaScript.</p></noscript>
<script src="health.js?v=12"></script>
<script src="progress.js?v=12"></script>
<script src="progress-view.js?v=12"></script>
<script src="stats.js?v=12"></script>
<script src="app.js?v=12"></script>
</body>
</html>
